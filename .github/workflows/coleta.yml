name: Coleta semanal

on:
  schedule:
    - cron: "0 11 * * 1"   # segunda-feira 08:00 (horário de Brasília = 11:00 UTC)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write   # grava ultima_coleta.txt (mantém os agendamentos ativos no GitHub)
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONIOENCODING: utf-8

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar todas as fontes
        run: python -m veiculos_br --banco veiculos.db coletar

      - name: Gerar o site
        env:
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: python -m veiculos_br --banco veiculos.db exportar --saida _site --repo "${{ github.repository }}" --avisar

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Registrar a data da coleta
        run: |
          date -Iseconds > ultima_coleta.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima_coleta.txt
          git commit -m "coleta semanal" || exit 0
          git pull --rebase && git push
